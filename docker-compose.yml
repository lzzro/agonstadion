# Dos contenedores: el sitio (Apache con PHP 8.3) y la base (MariaDB 10.11, la version de la VM del instituto).

name: stadion

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${SGDM_ROOT_CLAVE:?Falta SGDM_ROOT_CLAVE en el archivo .env}
      SGDM_APP_CLAVE: ${SGDM_APP_CLAVE:?Falta SGDM_APP_CLAVE en el archivo .env}
      TZ: America/Montevideo
    volumes:
      - datos:/var/lib/mysql
      - ./docker/db:/docker-entrypoint-initdb.d:ro
      - ./sql:/sgdm/sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    environment:
      STADION_DB_SERVIDOR: db
      STADION_DB_CLAVE: ${SGDM_APP_CLAVE:?Falta SGDM_APP_CLAVE en el archivo .env}
      TZ: America/Montevideo
    ports:
      - "8080:80"
    volumes:
      - subidas:/var/www/html/subidas
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Las pruebas de PHPUnit, solo cuando se piden: docker compose --profile pruebas run --rm pruebas
  pruebas:
    image: composer:2
    profiles: ["pruebas"]
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "composer install --no-interaction --no-progress && vendor/bin/phpunit"

volumes:
  datos:
  subidas:
