# Stadion en Docker: Apache lee los .htaccess del sitio.
ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>

# La aplicacion esta fuera de lo publicado; por las dudas, cerrada.
<Directory /var/www/stadion_app>
    Require all denied
</Directory>

# La clave de la base llega como variable de entorno del contenedor.
PassEnv STADION_DB_SERVIDOR STADION_DB_CLAVE
